name: Browser Extension Build

# Builds the Chromium extension and attaches it to the run as a zip for anyone to try: unzip it,
# turn on Developer mode in chrome://extensions and load the unzipped folder with "Load unpacked".
# A push to main also replaces the asset of the rolling bex-latest release, whose URL is stable and
# downloadable without a GitHub login. Branch and pull-request builds publish only their run's
# artifact, so a contribution cannot overwrite the release.
on:
  push:
    # a branch with bex in its name builds on every push, to try before it has a pull request
    branches: [main, '**bex**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # a pull request's own commit rather than its merge into main, so the zip is named
          # after a commit a tester can find on the pull request
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6  # reads pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bex  # also zips the unpacked extension into Packaged.cashonize-wallet.zip
      - run: mv dist/bex-chrome/Packaged.cashonize-wallet.zip "cashonize-extension-$(git rev-parse --short HEAD).zip"
      - uses: actions/upload-artifact@v7
        with:
          path: cashonize-extension-*.zip
          # archive: false gives testers the extension files inside the downloaded artifact's zip,
          # one unzip away from "Load unpacked"; the release job builds the zip it publishes
          archive: false
          if-no-files-found: error

  # The release is the repository's public download, so only main may write it. It belongs to the
  # contributing repository: the upstream project publishes named releases, not a rolling preview.
  # The job builds the zip itself: the run artifact is for testers, and a release must be exactly
  # the packaged file rather than whatever shape the artifact round-trip gives it.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_owner != 'cashonize'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the only job that may write to the repository
    concurrency:
      group: bex-latest-release
      cancel-in-progress: false  # a later main push must upload after the one before it
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6  # reads pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:bex
      - name: Publish the rolling bex-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv dist/bex-chrome/Packaged.cashonize-wallet.zip cashonize-extension.zip
          gh release view bex-latest >/dev/null 2>&1 || \
            gh release create bex-latest --target "$GITHUB_SHA" --prerelease \
              --title "BEX latest" \
              --notes "Rolling build of the Cashonize browser extension from the latest push to main. cashonize-extension.zip is replaced on every such push."
          gh release upload bex-latest cashonize-extension.zip --clobber
