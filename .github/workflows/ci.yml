name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6  # reads pnpm version from package.json "packageManager"
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec quasar prepare  # generates .quasar/tsconfig.json for path aliases
      - run: pnpm lint
      - run: pnpm exec vue-tsc --noEmit
      - run: pnpm check:i18n
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  # Comments the pull request's changed lines, split into code, tests, translations
  # and generated files, so the size of a change is readable at a glance.
  pr-stats:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the diff needs history back to the base commit
      - uses: actions/setup-node@v6
        with:
          node-version: 24  # runs the TypeScript directly, the script has no dependencies
      - run: node scripts/prStats.ts "$BASE_SHA" > stats.md
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - run: gh pr comment "$NUMBER" --body-file stats.md --edit-last --create-if-none
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
