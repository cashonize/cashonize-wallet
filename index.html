<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8">
    <meta name="description" content="<%= productDescription %>">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <meta name="viewport" content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>">

    <link rel="icon" type="image/png" sizes="128x128" href="icons/favicon-128x128.png">
    <link rel="icon" type="image/png" sizes="96x96" href="icons/favicon-96x96.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
    <link rel="icon" type="image/ico" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <% if (ctx.mode.spa || ctx.mode.pwa) { %>
    <!-- The card a chat app or social site shows for a shared link; only the hosted web wallet is
         ever shared. X reads the og: tags too, it needs only its own card type. -->
    <link rel="canonical" href="https://cashonize.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="<%= productName %>">
    <meta property="og:url" content="https://cashonize.com/">
    <meta property="og:title" content="<%= productName %>">
    <meta property="og:description" content="<%= productDescription %>">
    <meta property="og:image" content="https://cashonize.com/images/link-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Cashonize, a Bitcoin Cash wallet">
    <meta name="twitter:card" content="summary_large_image">
    <% } %>

  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
